<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AniTrack</title>
  <meta name="theme-color" content="#09090f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="description" content="Browse anime, follow the airing schedule and track every episode — synced with MyAnimeList.">
  <meta property="og:title" content="AniTrack">
  <meta property="og:description" content="Browse anime, follow the airing schedule and track every episode.">
  <meta property="og:type" content="website">
</head>
<body>
  <div id="loadbar" aria-hidden="true"></div>
  <header class="top" id="top">
    <a class="logo" href="#home"><span class="mark">▲</span><span>Ani<b>Track</b></span></a>
    <nav>
      <a href="#home" data-tab="home">Home</a>
      <a href="#browse" data-tab="browse">Browse</a>
      <a href="#schedule" data-tab="schedule">Schedule</a>
      <a href="#mylist" data-tab="mylist">My List</a>
      <a href="#random" data-tab="random" class="dice" title="Surprise me (g r)" aria-label="Random anime">🎲</a>
    </nav>
    <form id="search" role="search">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
      <input name="q" type="search" placeholder="Search anime…  ( / )" autocomplete="off" aria-label="Search anime" role="combobox" aria-autocomplete="list" aria-controls="suggest">
      <div id="suggest" class="suggest" role="listbox" hidden></div>
    </form>
    <button class="theme" id="theme" aria-label="Toggle light or dark theme" title="Toggle light / dark">◐</button>
    <div id="auth" class="auth"></div>
  </header>

  <main id="view"></main>

  <footer class="foot">
    Show data from <a href="https://anilist.co" target="_blank" rel="noopener">AniList</a> ·
    Tracking synced with <a href="https://myanimelist.net" target="_blank" rel="noopener">MyAnimeList</a>
  </footer>

  <dialog id="player" class="player">
    <button class="x" data-close aria-label="Close">×</button>
    <div class="frame"><iframe id="player-frame" title="Trailer" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
  <div id="askbar" class="askbar" role="dialog" aria-live="polite" hidden></div>
  <script src="app.js"></script>
</body>
</html>
